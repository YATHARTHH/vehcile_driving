name: Production CI Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------
  # Unified Production CI Pipeline (Backend, Security, & Frontend)
  # ---------------------------------------------------------------
  production-ci:
    name: Production CI Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx ruff bandit

      - name: Code Quality & Syntax Check (Ruff)
        run: |
          ruff check backend/ --select E,F,W --ignore E501

      - name: Security & AST Vulnerability Scan (Bandit)
        run: |
          bandit -r backend/ -ll -ii

      - name: Run Backend Integration & Unit Tests (Pytest)
        run: |
          python -m pytest backend/tests -v --cov=backend --cov-report=term-missing

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run TypeScript Type Check
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Build Production Bundle (Vite)
        run: |
          cd frontend
          npm run build
